[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compatibilizabim-core"
version = "2.1.0"
description = "CompatibilizaBIM Core - cumulative CAD to CBIM through product workflow, persistent workspaces, real-DWG MEP hardening, optimized geometry/topology/recognizers/connectivity, optional IfcOpenShell authoring/validation, evidence-based MEP recognition, spatial Text Intelligence, conservative MEP Z reconstruction and network propagation, composite architectural reconstruction, explicit MEP fittings, Revit-oriented IFC geometry/properties/quantities, CBIM Catalog Brasil, open-source AI adapters, progress diagnostics, desktop bootstrap, offline licensing and commercial pilot gate"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "ezdxf>=1.3,<2",
  "shapely>=2.0,<3",
  "cbim-sdk>=0.4.0,<0.5",
  "cryptography>=45,<47"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ifc = ["ifcopenshell>=0.8.3,<0.9"]

[tool.pytest.ini_options]
pythonpath = ["src", "../cbim-sdk/python/src"]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
cbim-validate-dwg = "compatibilizabim_core.validation.cli:main"
cbim-product = "compatibilizabim_core.product.cli:main"
cbim-desktop = "compatibilizabim_core.desktop.cli:main"
cbim-commercial = "compatibilizabim_core.commercial.cli:main"
cbim-revit = "compatibilizabim_core.revit.cli:main"

