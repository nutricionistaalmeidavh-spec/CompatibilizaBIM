name: P1 CBIM Studio and Windows Pilot
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

jobs:
  secure-studio-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-cbim-qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CBIM Core and SDK
        run: |
          python -m pip install -e ./integrations/cbim-2.1.0/cbim-sdk/python
          python -m pip install -e './integrations/cbim-2.1.0/compatibilizabim-core[dev]'
      - name: Engineering mathematical kernel unit regression
        run: |
          python -m pip install 'sympy==1.14.0' 'mpmath==1.3.0'
          python -m unittest discover -s test -p 'test_engineering_math.py'
      - name: P1 Studio security regression
        run: python -m pytest -q integrations/cbim-2.1.0/compatibilizabim-core/tests/test_p1_secure_studio.py integrations/cbim-2.1.0/compatibilizabim-core/tests/test_p1_studio_launcher.py
      - name: Core and SDK full regression
        run: |
          python -m pytest -q integrations/cbim-2.1.0/compatibilizabim-core/tests
          python -m pytest -q integrations/cbim-2.1.0/cbim-sdk/python/tests
      - name: P2 operational regressions (4D, 5D and measured deltas)
        env:
          PYTHONPATH: modules
        run: python -m pytest -q modules/compatibilizabim/tests/test_p2_workflow.py
      - name: Real DWG comparator unit tests
        run: python -m unittest discover -s test -p 'test_p1_regression_report.py'

  node-and-frontend:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-cbim-qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        run: |
          npm install --package-lock-only --prefix app
          npm ci --prefix app
          ln -s app/node_modules node_modules
      - name: Preserve synchronized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: F3-synchronized-package-lock
          path: app/package-lock.json
          retention-days: 1
      - name: Node regression
        run: npm test
      - name: Build renderer
        working-directory: app
        run: npm run build

  dwg-fixtures:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-cbim-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6feeb60e8b376def69d9e8ddb6b3788c56418397
          path: real-dwg-inputs
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            materiais-local-2026-09-30/DWG/BARRILETE.dwg
            materiais-local-2026-09-30/DWG/QUA-HID-LO-0100-TERR-R02.dwg
      - name: Download and verify DWGs with Linux Git LFS
        working-directory: real-dwg-inputs
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="materiais-local-2026-09-30/DWG/BARRILETE.dwg,materiais-local-2026-09-30/DWG/QUA-HID-LO-0100-TERR-R02.dwg" --exclude=""
          printf '%s  %s\n' \
            'b2f02c77c3028f3be107b2f06f78508321732015143a87443f884362002f9be5' \
            'materiais-local-2026-09-30/DWG/BARRILETE.dwg' \
            'f48290b8b8d9fb626ece26d325f1f2570e134c61c17ebc12f812f6f49190ea17' \
            'materiais-local-2026-09-30/DWG/QUA-HID-LO-0100-TERR-R02.dwg' | sha256sum -c -
      - name: Upload one-day verified DWG input artifact for Windows regression
        uses: actions/upload-artifact@v4
        with:
          name: CompatibilizaBIM-F0-Verified-DWGs
          path: real-dwg-inputs/materiais-local-2026-09-30/DWG/
          if-no-files-found: error
          retention-days: 1

  windows-installer-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-cbim-qa'
    needs: [dwg-fixtures]
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar runtime Windows e instalador NSIS (sem publicar)
        shell: pwsh
        run: |
          .\scripts\build-p1-windows.ps1
      - name: P2 packaged runtime 4D/5D smoke without local installation
        shell: pwsh
        run: |
          $r=Join-Path (Get-Location) 'runtime_min/python/cbim-runtime.exe'
          $study=Join-Path $env:RUNNER_TEMP 'cbim-p2-study'
          New-Item -Force -ItemType Directory -Path $study | Out-Null
          $request=Join-Path $study 'request.json'
          '{}' | Set-Content -LiteralPath $request -Encoding ascii
          & $r p2 $study status --request $request
          if ($LASTEXITCODE -ne 0) {throw 'P2 Python runtime did not load in packaged Windows executable'}
      - name: Download Linux-verified samples into Windows
        uses: actions/download-artifact@v4
        with:
          name: CompatibilizaBIM-F0-Verified-DWGs
          path: .f0-real-samples
      - name: Verify local SHA256 of the staged DWGs
        shell: pwsh
        run: |
          $a=(Get-FileHash -Algorithm SHA256 '.f0-real-samples/BARRILETE.dwg').Hash.ToLower()
          $b=(Get-FileHash -Algorithm SHA256 '.f0-real-samples/QUA-HID-LO-0100-TERR-R02.dwg').Hash.ToLower()
          if ($a -ne 'b2f02c77c3028f3be107b2f06f78508321732015143a87443f884362002f9be5') { throw 'BARRILETE hash mismatch' }
          if ($b -ne 'f48290b8b8d9fb626ece26d325f1f2570e134c61c17ebc12f812f6f49190ea17') { throw 'QUA-HID hash mismatch' }
      - name: Validate bundled ACadSharp, real DWGs and IFC sanity (no installation)
        shell: pwsh
        run: |
          .\scripts\f0-smoke-real-dwg.ps1 -SamplesDir (Join-Path (Get-Location) '.f0-real-samples')
      - name: Create F0 artifact provenance and SHA256 manifest
        shell: pwsh
        run: |
          node scripts/f0-release-manifest.cjs
      - name: Verify P3 QA artifact SHA256 and human gate separation
        shell: pwsh
        run: |
          node scripts/p3-release-check.cjs --manifest .p1-build/f0-smoke/release-manifest.json --root . --out .p1-build/f0-smoke/p3-release-readiness.json
          if ($LASTEXITCODE -ne 0) { throw 'P3 QA artifact verification failed' }
      - name: Save F0 sanitized Windows smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CompatibilizaBIM-F0-RealDWG-Windows-QA
          path: |
            .p1-build/f0-smoke/f0-windows-smoke-summary.json
            .p1-build/f0-smoke/release-manifest.json
            .p1-build/f0-smoke/p3-release-readiness.json
          if-no-files-found: warn
          retention-days: 7
      - name: Disponibilizar instalador apenas como artefato QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CompatibilizaBIM-Studio-P1-Windows-Preview
          path: |
            app/dist-installers/*.exe
          if-no-files-found: error
          retention-days: 7

  react-browser-qa:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-cbim-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI and browser test dependencies
        run: |
          npm install --package-lock-only --prefix app
          npm ci --prefix app
          npm install --no-save --prefix app playwright@1.56.0
          ./app/node_modules/.bin/playwright install --with-deps chromium
      - name: Run local-first React browser smoke QA
        run: |
          npm run build --prefix app
          npm run preview --prefix app -- --host 127.0.0.1 --port 5173 > /tmp/cbim-vite.log 2>&1 &
          node scripts/qa/reactBrowserSmoke.cjs || { cat /tmp/cbim-vite.log; exit 1; }
      - name: Save React regression screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CompatibilizaBIM-React-QA-screenshots
          path: test/react-qa-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
