name: CompatibilizaBIM P4 Premium 5D Reconciliation QA
on:
  push:
    branches:
      - feat/p4-premium-5d-medicoes-conferencia-20261013
    paths:
      - .github/workflows/cbim-p4-measurements-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned React desktop
        run: |
          npm ci --prefix app
          ln -s app/node_modules node_modules
      - name: Node regression and P4 canonical contracts
        run: npm test
      - name: Production React build
        run: npm run build --prefix app
      - name: Install Chromium
        run: |
          npm install --no-save --prefix app playwright@1.56.0
          ./app/node_modules/.bin/playwright install --with-deps chromium
      - name: Existing React engineering journey
        run: |
          npm run preview --prefix app -- --host 127.0.0.1 --port 5173 > /tmp/cbim-preview.log 2>&1 &
          node scripts/qa/reactBrowserSmoke.cjs || { cat /tmp/cbim-preview.log; exit 1; }
      - name: P4 measurement UI with explicitly synthetic QA fixtures
        run: node scripts/qa/reactMeasurementsP4.cjs
      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CBIM-P4-React-Synthetic-QA-Screenshots
          path: test/react-qa-artifacts/*.png
          retention-days: 14
          if-no-files-found: warn
  python-bim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python IFC regressions
        run: python -m pip install -r modules/compatibilizabim-requirements.txt pytest
      - name: Python P2 P3 P4 5D contracts and IFC engine
        env:
          PYTHONPATH: modules
        run: python -m pytest -q modules/compatibilizabim/tests/test_p2_workflow.py modules/compatibilizabim/tests/test_p3_gantt.py modules/compatibilizabim/tests/test_p4_measurements.py modules/compatibilizabim/tests/test_ifc_query.py

# P4 QA checkpoint 2
