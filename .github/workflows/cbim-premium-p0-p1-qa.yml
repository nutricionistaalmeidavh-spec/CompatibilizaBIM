name: CompatibilizaBIM P0-P1 Premium React and Canonical QA
on:
  push:
    branches:
      - feat/p0-p1-premium-obras-canonical-20261013
    paths:
      - .github/workflows/cbim-premium-p0-p1-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned desktop React dependencies
        run: |
          npm ci --prefix app
          ln -s app/node_modules node_modules
      - name: Native and domain unit tests
        run: npm test
      - name: React production build
        run: npm run build --prefix app
      - name: Install Playwright browser
        run: |
          npm install --no-save --prefix app playwright@1.56.0
          ./app/node_modules/.bin/playwright install --with-deps chromium
      - name: Real-data portfolio and engineering journey E2E
        run: |
          npm run preview --prefix app -- --host 127.0.0.1 --port 5173 > /tmp/cbim-preview.log 2>&1 &
          node scripts/qa/reactBrowserSmoke.cjs || { cat /tmp/cbim-preview.log; exit 1; }
      - name: Store actual React QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CBIM-P0-P1-Premium-Real-UI
          path: test/react-qa-artifacts/*.png
          retention-days: 14
          if-no-files-found: warn
  python-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install IFC Python dependencies
        run: python -m pip install -r modules/compatibilizabim-requirements.txt pytest
      - name: Python P2 and IFC query regressions
        env:
          PYTHONPATH: modules
        run: python -m pytest -q modules/compatibilizabim/tests/test_p2_workflow.py modules/compatibilizabim/tests/test_ifc_query.py

# QA checkpoint 2: corrected ARIA searchbox selector; capture populated real-data table.
