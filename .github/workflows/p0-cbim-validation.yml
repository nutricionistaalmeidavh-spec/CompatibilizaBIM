name: P0 CBIM Integration CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/p0-cbim-core-integration]
  pull_request:
    branches: [main]
    paths:
      - 'src/bim/**'
      - 'app/**'
      - 'modules/compatibilizabim/**'
      - 'integrations/cbim-2.1.0/**'
      - 'test/**'
      - '.github/workflows/p0-cbim-validation.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies used by root regression tests
        run: |
          npm install --package-lock-only --prefix app
          npm ci --prefix app
          ln -s app/node_modules node_modules
      - name: Unit and regression tests
        run: npm test
      - name: Electron renderer build
        working-directory: app
        run: npm run build
  cbim-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recovered Python core in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./integrations/cbim-2.1.0/cbim-sdk/python
          python -m pip install -e './integrations/cbim-2.1.0/compatibilizabim-core[dev]'
      - name: Python syntax
        run: python -m compileall -q integrations/cbim-2.1.0/compatibilizabim-core/src integrations/cbim-2.1.0/cbim-sdk/python/src
      - name: Core regression suite
        run: python -m pytest -q integrations/cbim-2.1.0/compatibilizabim-core/tests
      - name: SDK regression suite
        run: python -m pytest -q integrations/cbim-2.1.0/cbim-sdk/python/tests
  lfs-backup-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup/all-cbim-materials-2026-09-30-v2
          path: backup
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            materiais-local-2026-09-30/DWG/BARRILETE.dwg
            materiais-local-2026-09-30/DWG/QUA-HID-LO-0100-TERR-R02.dwg
      - name: Download LFS samples from remote and verify SHA256
        working-directory: backup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6feeb60e8b376def69d9e8ddb6b3788c56418397"
          git lfs version
          git lfs install --local
          git lfs pull --include="materiais-local-2026-09-30/DWG/BARRILETE.dwg,materiais-local-2026-09-30/DWG/QUA-HID-LO-0100-TERR-R02.dwg" --exclude=""
          printf '%s  %s\n' \
            'b2f02c77c3028f3be107b2f06f78508321732015143a87443f884362002f9be5' \
            'materiais-local-2026-09-30/DWG/BARRILETE.dwg' \
            'f48290b8b8d9fb626ece26d325f1f2570e134c61c17ebc12f812f6f49190ea17' \
            'materiais-local-2026-09-30/DWG/QUA-HID-LO-0100-TERR-R02.dwg' | sha256sum -c -
